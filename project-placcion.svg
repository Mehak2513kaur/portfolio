  <circle cx="99" cy="52" r="5" fill="#10b981" opacity="0.8" />
  <text x="130" y="56" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600">placcion.ai // placement_prediction_pipeline.py</text>
  <rect x="630" y="42" width="110" height="20" rx="10" fill="#22c55e" fill-opacity="0.15" />
  <text x="648" y="56" fill="#22c55e" font-family="'Inter', sans-serif" font-size="11" font-weight="700">● LIVE MODEL</text>

