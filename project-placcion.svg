  <rect x="460" y="295" width="280" height="100" rx="12" fill="#1a1e28" stroke="#262b37" stroke-width="1" />
  <text x="480" y="322" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">API Latency</text>
  <text x="480" y="344" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800">14ms</text>
  <text x="590" y="322" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">ROC-AUC</text>
  <text x="590" y="344" fill="#22c55e" font-family="'Inter', sans-serif" font-size="18" font-weight="800">0.962</text>
  <text x="680" y="322" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Engine</text>
  <text x="680" y="344" fill="#ffffff" font-family="'Inter', sans-serif" font-size="15" font-weight="800">Py3.11</text>
  <text x="480" y="375" fill="#475569" font-family="'Inter', sans-serif" font-size="10">End-to-End Supervised ML Pipeline</text>
