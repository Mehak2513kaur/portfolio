  <text x="85" y="142" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">XGBoost Feature Contributions to Placement Probability</text>

  <!-- Bars -->
  <!-- Bar 1 -->
  <text x="85" y="175" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Technical Score (DSA &amp; ML)</text>
