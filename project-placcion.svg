  <text x="480" y="195" fill="#22c55e" font-family="'Inter', sans-serif" font-size="42" font-weight="900">95.4%</text>
  <text x="480" y="215" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Placement Probability: HIGH</text>
  <text x="480" y="235" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Tier-1 Corporate Fit · Top Decile</text>
  <rect x="480" y="250" width="240" height="15" rx="7.5" fill="#22c55e" fill-opacity="0.15" />
  <text x="600" y="261" fill="#22c55e" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">✓ CONFIDENCE: OPTIMAL</text>

