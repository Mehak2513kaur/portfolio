  <text x="192" y="370" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">FastAPI</text>
  <rect x="230" y="355" width="65" height="22" rx="11" fill="#252b38" />
  <text x="262" y="370" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">SHAP XAI</text>

