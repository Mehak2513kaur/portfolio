<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-cardio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c14" />
      <stop offset="100%" stop-color="#1a121c" />
    </linearGradient>
    <linearGradient id="stenosis-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-cardio)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Window Frame -->
  <rect x="40" y="30" width="720" height="390" rx="16" fill="#18111b" stroke="#36223b" stroke-width="1.5" />

  <!-- Titlebar -->
  <rect x="40" y="30" width="720" height="44" rx="16" fill="#241829" />
  <rect x="40" y="58" width="720" height="16" fill="#241829" />
  <circle cx="65" cy="52" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="82" cy="52" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="99" cy="52" r="5" fill="#10b981" opacity="0.8" />
  <text x="130" y="56" fill="#c084fc" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600">cardioai.med // coronary_angiogram_analysis.py</text>
  <rect x="620" y="42" width="120" height="20" rx="10" fill="#f43f5e" fill-opacity="0.15" />
  <text x="635" y="56" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="11" font-weight="700">● RF + SVM ENSEMBLE</text>

  <!-- Left: Angiogram Vascular Tree Schematic -->
  <rect x="65" y="95" width="340" height="300" rx="12" fill="#201524" stroke="#36223b" stroke-width="1" />
  
  <g transform="translate(140, 110)">
    <!-- Main Coronary Trunk -->
    <path d="M 90,10 Q 95,50 110,80 Q 120,110 135,160 Q 145,200 150,230" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" opacity="0.75" />
    
    <!-- Circumflex Branch -->
    <path d="M 110,80 Q 70,110 40,150 Q 20,180 15,220" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" opacity="0.5" />
    
    <!-- Diagonal Branch -->
    <path d="M 135,160 Q 100,190 80,225" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    
    <!-- Detected Stenosis (Blockage Area) -->
    <circle cx="123" cy="120" r="18" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,2" />
    <circle cx="123" cy="120" r="7" fill="#f43f5e" />
    <path d="M 115,100 L 130,138" stroke="url(#stenosis-glow)" stroke-width="4" />
    
    <!-- Callout Tag -->
    <line x1="141" y1="120" x2="185" y2="120" stroke="#f43f5e" stroke-width="1.5" />
    <rect x="185" y="105" width="85" height="28" rx="4" fill="#f43f5e" />
    <text x="227" y="119" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">STENOSIS</text>
    <text x="227" y="129" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">LAD (78% BLOCK)</text>
  </g>
  <text x="235" y="375" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">CORONARY VESSEL SEGMENTATION ACTIVE</text>

  <!-- Right: GLCM & LBP Texture Extraction Metrics -->
  <rect x="425" y="95" width="315" height="300" rx="12" fill="#201524" stroke="#36223b" stroke-width="1" />
  <text x="445" y="125" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Texture Feature Matrix</text>
  <text x="445" y="142" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">GLCM &amp; Local Binary Patterns (LBP)</text>

  <!-- Metric 1 -->
  <rect x="445" y="165" width="130" height="52" rx="8" fill="#2a1d30" />
  <text x="455" y="185" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">GLCM Contrast</text>
  <text x="455" y="206" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="16" font-weight="800">0.842</text>

  <!-- Metric 2 -->
  <rect x="590" y="165" width="130" height="52" rx="8" fill="#2a1d30" />
  <text x="600" y="185" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">GLCM Homogeneity</text>
  <text x="600" y="206" fill="#c084fc" font-family="'Inter', sans-serif" font-size="16" font-weight="800">0.915</text>

  <!-- Metric 3 -->
  <rect x="445" y="225" width="130" height="52" rx="8" fill="#2a1d30" />
  <text x="455" y="245" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">LBP Uniformity</text>
  <text x="455" y="266" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="16" font-weight="800">0.789</text>

  <!-- Metric 4 -->
  <rect x="590" y="225" width="130" height="52" rx="8" fill="#2a1d30" />
  <text x="600" y="245" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Ensemble F1</text>
  <text x="600" y="266" fill="#22c55e" font-family="'Inter', sans-serif" font-size="16" font-weight="800">94.7%</text>

  <!-- Clinical Interpretability Box -->
  <rect x="445" y="290" width="275" height="90" rx="8" fill="#2a1d30" stroke="#4a2e54" stroke-width="1" />
  <text x="460" y="315" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="700">★ EXPLAINABLE AI INTERPRETABILITY</text>
  <text x="460" y="335" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Random Forest + SVM High Agreement (κ = 0.91)</text>
  <text x="460" y="355" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Validated on DICOM angiography benchmarks</text>
</svg>
